name: Validacao sem implantacao
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validacao-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      GCLOUD_PROJECT: demo-catalogos-emulator
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      VITE_APP_ENV: test
      VITE_FIREBASE_PROJECT_ID: demo-catalogos-emulator
      VITE_FIREBASE_API_KEY: fake-api-key
      VITE_FIREBASE_AUTH_DOMAIN: localhost
      VITE_FIREBASE_APP_ID: fake-app
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://127.0.0.1:9099
      VITE_API_URL: http://localhost:3000
      VITE_LOJA_ID: loja-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            demo/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: node infra/scripts/verificar-segredos.cjs
      - run: node --test infra/test/configuracoes.test.cjs
      - run: npm ci --ignore-scripts
        working-directory: backend
      - run: npm ci --ignore-scripts
        working-directory: demo
      - run: npm test
        working-directory: backend
      - run: npm test
        working-directory: demo
      - run: npm run build
        working-directory: demo
      - run: npm audit --audit-level=moderate
        working-directory: backend
      - run: npm audit --audit-level=moderate
        working-directory: demo
      - run: npm install --global firebase-tools@15.32.0
      - name: Regressoes em projeto ficticio
        env:
          APP_ENV: test
          GCLOUD_PROJECT: demo-catalogos-emulator
          ETAPA24_EVIDENCIAS: /tmp/catalogos-ci-homologacao
          CHROME_BIN: /usr/bin/google-chrome
        run: firebase emulators:exec --project demo-catalogos-emulator --only auth,firestore 'node backend/scripts/etapa25-emulator-suite.js'
      # Sem secrets, id-token, upload ou deploy; publicação exige fluxo separado aprovado.
